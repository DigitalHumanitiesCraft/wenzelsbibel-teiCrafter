# Fork-only checks. The inherited checks.yml stays identical to the base; this
# workflow adds the editorial layer, the flow spike and the fork's typechecks.
name: fork-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fork-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Node dependencies
        run: npm ci
      - name: Install Python tools
        run: python -m pip install lxml ruff
      - name: Fork checks
        run: npm run check:fork
